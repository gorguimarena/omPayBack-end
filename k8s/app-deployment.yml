apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
      - name: laravel-app
        image: gorguimarena/ompay-backend:latest
        ports:
        - containerPort: 9000
        envFrom:
        - configMapRef:
            name: app-env
        - secretRef:
            name: app-secret
        volumeMounts:
        - name: app-storage
          mountPath: /var/www/storage
      volumes:
      - name: app-storage
        emptyDir: {}